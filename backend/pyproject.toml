[project]
name = "caregiver-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "apscheduler",
    "pydantic-settings",
    "pydantic[email]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.1",
    "openai",
    "httpx",
    "boto3",
    "python-multipart",
    "google-auth",
    "requests",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
